name: fibertrack
description: Gestión y trazabilidad de fibra óptica.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  flutter_secure_storage: ^9.2.4
  share_plus: ^12.0.0
  path_provider: ^2.1.5
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: assets/branding/fibertrack_icon_legacy.jpg
  adaptive_icon_background: "#F3F8F6"
  adaptive_icon_foreground: assets/branding/fibertrack_icon_foreground.png
  min_sdk_android: 24

flutter:
  uses-material-design: true
